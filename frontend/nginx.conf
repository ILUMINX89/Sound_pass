# Sirve el frontend y reenvía /api a la API dentro del clúster,
# igual que el nginx de la VM. Así el navegador no cruza orígenes (sin CORS).
server {
    listen 80;
    server_name _;
    root /srv/soundpass;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; frame-src https://open.spotify.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location ~ /\. { return 404; }

    location /api/ {
        add_header X-Content-Type-Options nosniff always;
        proxy_pass http://soundpass-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = / { try_files /index.html =404; }
    location ~ ^/(index\.html|style\.css|script\.js|admin\.html|admin\.css|admin\.js)$ { try_files $uri =404; }
    location / { return 404; }
}
