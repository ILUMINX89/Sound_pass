name: Reporte de bug
description: Algo que no funciona como debería.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Describe el error con el detalle suficiente para que cualquiera del equipo lo pueda **reproducir** sin preguntarte.

  - type: dropdown
    id: rol
    attributes:
      label: Rol
      description: Qué parte de la app falla.
      options:
        - Backend
        - Frontend
        - DevOps
        - QA
        - Documentación
    validations:
      required: true

  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      description: Alta = la app no se puede usar. Media = molesta pero hay forma de seguir. Baja = detalle visual.
      options:
        - Alta
        - Media
        - Baja
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Entrar a la app e iniciar sesión
        2. Abrir el concierto "..."
        3. Comprar 2 boletas VIP
        4. Ver el error
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Qué pasa en realidad
      description: Copia el mensaje de error exacto si hay uno.
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Capturas, logs de la terminal o de la consola del navegador (F12).

  - type: dropdown
    id: entorno
    attributes:
      label: Dónde pasó
      options:
        - Local (docker compose)
        - Producción (nube)
    validations:
      required: true
