name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar que la app importa sin errores
        working-directory: backend
        run: python -c "from src.main import app"

      - name: Verificar autenticación y propiedad con BD aislada
        working-directory: backend
        run: python -m unittest discover -s tests -p test_api_security.py -v

      - name: Construir la imagen Docker del backend
        run: docker build -t soundpass-api:ci ./backend
