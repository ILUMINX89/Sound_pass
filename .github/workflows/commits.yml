name: Revisión de commits

# Revisa que cada commit de un PR siga el formato del equipo:
#   tipo: descripción corta en minúscula
# Tipos permitidos: feat, fix, docs, style, refactor, test, ci, chore, perf, build, revert
# Ejemplo: "feat: agregar filtro de conciertos por fecha"
# El formato completo está explicado en CONTRIBUTING.md
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  formato:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar mensajes de commit
        uses: actions/github-script@v7
        with:
          script: |
            const FORMATO = /^(feat|fix|docs|style|refactor|test|ci|chore|perf|build|revert)(\([a-z0-9-]+\))?!?: \S.{2,70}$/;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const malos = [];
            for (const c of commits) {
              const titulo = c.commit.message.split('\n')[0];
              if (titulo.startsWith('Merge ') || titulo.startsWith('Revert "')) continue;
              if (!FORMATO.test(titulo)) malos.push(`${c.sha.slice(0, 7)}  ${titulo}`);
            }

            if (malos.length === 0) {
              core.info(`Los ${commits.length} commits siguen el formato ✅`);
              return;
            }
            core.setFailed([
              'Estos commits no siguen el formato "tipo: descripción":',
              ...malos.map(m => `  ✗ ${m}`),
              '',
              'Ejemplo válido: "fix: corregir el total de la orden al cancelar"',
              'Para corregirlos, mira la sección "Cómo arreglar un commit" de CONTRIBUTING.md',
            ].join('\n'));
