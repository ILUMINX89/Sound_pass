name: Imágenes (GHCR)

# Construye las imágenes de la API y del frontend y las publica en
# GitHub Container Registry. Kubernetes las descarga de ahí.
#   ghcr.io/iluminx89/sound_pass-api
#   ghcr.io/iluminx89/sound_pass-frontend
# Etiquetas: el sha del commit, el nombre de la rama y "latest" en development.
on:
  push:
    branches: [development, production, "feature/**"]
    paths: ["backend/**", "frontend/**", ".github/workflows/images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { nombre: api, carpeta: backend }
          - { nombre: frontend, carpeta: frontend }
    steps:
      - uses: actions/checkout@v4

      # GHCR exige el nombre en minúsculas
      - name: Nombre de la imagen
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.nombre }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == 'development' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.carpeta }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
