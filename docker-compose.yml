services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: soundpass_user
      POSTGRES_PASSWORD: soundpass_pass
      POSTGRES_DB: soundpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundpass_user -d soundpass"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://soundpass_user:soundpass_pass@db:5432/soundpass
      SECRET_KEY: change-this-to-a-long-random-string
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
