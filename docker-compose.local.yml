# Solo desarrollo: añadir explícitamente con -f, nunca se carga automáticamente.
services:
  api:
    environment:
      APP_ENV: local
      ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500

    networks:
      default:
        aliases: [soundpass-api]
  catalog-sync:
    environment:
      APP_ENV: local
  frontend:
    image: nginx:alpine
    ports:
      - "127.0.0.1:5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
        restart: true
