# Solo desarrollo: añadir explícitamente con -f, nunca se carga automáticamente.
services:
  api:
    environment:
      APP_ENV: local
      ALLOWED_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
    networks:
      default:
        aliases:
          - soundpass-api

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5500:80"
    depends_on:
      - api
