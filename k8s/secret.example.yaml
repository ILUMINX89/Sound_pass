# PLANTILLA del Secret. Este archivo sí se sube al repo, con valores falsos.
# Para usarlo:
#   1. Copiarlo como k8s/secret.yaml (ese archivo está en .gitignore)
#   2. Cambiar CLAVE_BASE y CLAVE_JWT por valores aleatorios
# POSTGRES_PASSWORD y la contraseña dentro de DATABASE_URL deben ser iguales.
apiVersion: v1
kind: Secret
metadata:
  name: soundpass-secrets
  namespace: soundpass
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CLAVE_BASE"
  DATABASE_URL: "postgresql+psycopg2://soundpass_user:CLAVE_BASE@soundpass-db:5432/soundpass"
  SECRET_KEY: "CLAVE_JWT"
  SPOTIFY_CLIENT_ID: ""
  SPOTIFY_CLIENT_SECRET: ""
  TICKETMASTER_API_KEY: ""
