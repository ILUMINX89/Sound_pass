apiVersion: batch/v1
kind: Job
metadata:
  generateName: soundpass-catalog-sync-
  namespace: soundpass
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 540
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: catalog-sync
          image: soundpass-catalog-sync:5415c95
          imagePullPolicy: Never
          command: ["python", "-m", "src.sync_ticketmaster", "--once"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: soundpass-secrets
                  key: DATABASE_URL
            - name: TICKETMASTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soundpass-secrets
                  key: TICKETMASTER_API_KEY
            - name: TICKETMASTER_SCOPE
              value: artist_origin
            - name: TICKETMASTER_ARTIST_ORIGINS
              value: "US,MX,CO,AR,PR"
