# Autoescalado: entre 2 y 5 réplicas de la API según el uso de CPU.
# Si el promedio pasa del 50 % de lo reservado (requests.cpu), agrega pods.
# Requiere: minikube addons enable metrics-server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: soundpass-api
  namespace: soundpass
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: soundpass-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
