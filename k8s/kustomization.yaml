# Lista de lo que se aplica con: kubectl apply -k k8s/
# secret.example.yaml NO está aquí: es solo la plantilla.
# secret.yaml (con valores reales) no se sube al repo (.gitignore).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - secret.yaml
  - 10-postgres.yaml
  - 20-api.yaml
  - 30-frontend.yaml
  - 40-ingress.yaml
  - 50-hpa.yaml
